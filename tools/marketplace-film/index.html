<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Cómo funciona Buyniverse</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08071a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #f4f2ff; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="ground" class="scene clip" data-composition-id="ground" data-composition-src="compositions/ground.html"
        data-start="0" data-duration="20" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="filter" class="scene clip" data-composition-id="filter" data-composition-src="compositions/filter.html"
        data-start="0" data-duration="5.4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="auction" class="scene clip" data-composition-id="auction" data-composition-src="compositions/auction.html"
        data-start="5.4" data-duration="5.2" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="settle" class="scene clip" data-composition-id="settle" data-composition-src="compositions/settle.html"
        data-start="10.6" data-duration="5" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="endcard" class="scene clip" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="15.6" data-duration="4.4" data-track-index="4" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Scenes carry their own timelines; the runtime nests them.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
