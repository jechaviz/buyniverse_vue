<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; padding: 88px 112px; display: flex; flex-direction: column; justify-content: center; gap: 48px; font-family: Inter, sans-serif; color: #f4f2ff; }
        #settle-head { display: flex; align-items: baseline; gap: 28px; }
        #settle-step { font: 700 26px "Space Grotesk", Inter, sans-serif; color: #16d9a0; letter-spacing: 0.08em; }
        #settle-title { font: 700 76px/1 "Space Grotesk", Inter, sans-serif; letter-spacing: -0.035em; }
        #settle-award { display: flex; align-items: center; gap: 24px; padding: 28px 36px; border-radius: 28px; background: linear-gradient(120deg, rgba(22, 217, 160, 0.16), rgba(18, 16, 48, 0.88)); border: 1px solid rgba(22, 217, 160, 0.4); }
        #settle-award-avatar { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(140deg, #34e3b3, #0a8f69); color: #04291e; font: 700 26px "Space Grotesk", Inter, sans-serif; }
        #settle-award b { display: block; font: 700 34px "Space Grotesk", Inter, sans-serif; }
        #settle-award small { display: block; font-size: 22px; color: #a8a3cc; margin-top: 4px; }
        #settle-award-price { margin-left: auto; font: 700 48px "Space Grotesk", Inter, sans-serif; color: #6ff2c8; font-variant-numeric: tabular-nums; }
        #settle-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
        .settle-card { position: relative; padding: 34px; border-radius: 28px; background: rgba(18, 16, 48, 0.86); border: 1px solid rgba(155, 133, 255, 0.2); display: grid; gap: 14px; }
        .settle-badge { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; font: 700 28px "Space Grotesk", Inter, sans-serif; }
        .settle-badge-num { border: 3px solid rgba(155, 133, 255, 0.5); color: #9b85ff; }
        .settle-badge-done { position: absolute; top: 34px; left: 34px; background: #0a8f69; color: #ffffff; box-shadow: 0 0 0 4px rgba(22, 217, 160, 0.35); }
        .settle-card b { font: 700 34px "Space Grotesk", Inter, sans-serif; letter-spacing: -0.02em; }
        .settle-card span { font-size: 22px; color: #a8a3cc; line-height: 1.4; }
        #settle-rail { height: 14px; border-radius: 999px; background: #19163d; overflow: hidden; }
        #settle-rail-fill { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, #6d4aff, #16d9a0); transform-origin: left center; }
        #settle-escrow { align-self: center; display: flex; align-items: center; gap: 16px; height: 84px; padding: 0 40px; border-radius: 999px; font: 700 32px "Space Grotesk", Inter, sans-serif; background: #16d9a0; color: #04291e; }
      </style>

      <div id="root" data-composition-id="settle" data-width="1920" data-height="1080">
        <div id="settle-head">
          <span id="settle-step">03</span>
          <h1 id="settle-title">Adjudica, concilia y paga</h1>
        </div>

        <div id="settle-award">
          <span id="settle-award-avatar">AN</span>
          <div><b>Aduana Norte gana la subasta</b><small>Orden de compra creada con el precio final</small></div>
          <span id="settle-award-price">$21,400</span>
        </div>

        <div id="settle-steps">
          <div class="settle-card" id="settle-c1"><span class="settle-badge settle-badge-num" id="settle-n1">1</span><span class="settle-badge settle-badge-done" id="settle-d1"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Orden de compra</b><span>Precio y condiciones de la adjudicación</span></div>
          <div class="settle-card" id="settle-c2"><span class="settle-badge settle-badge-num" id="settle-n2">2</span><span class="settle-badge settle-badge-done" id="settle-d2"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Recepción</b><span>Lo recibido coincide con lo pedido</span></div>
          <div class="settle-card" id="settle-c3"><span class="settle-badge settle-badge-num" id="settle-n3">3</span><span class="settle-badge settle-badge-done" id="settle-d3"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>Factura CFDI 4.0</b><span>Conciliada contra orden y recepción</span></div>
        </div>

        <div id="settle-rail"><i id="settle-rail-fill"></i></div>
        <div id="settle-escrow"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#04291e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Pago en custodia liberado</div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const E = "power3.out";

          tl.fromTo("#settle-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 0);
          tl.fromTo("#settle-award", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.2);
          tl.fromTo("#settle-steps .settle-card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E, stagger: 0.1 }, 0.6);
          tl.set("#settle-rail-fill", { scaleX: 0 }, 0);
          tl.set("#settle-escrow", { opacity: 0, scale: 0.8 }, 0);

          // The receipt checks off in order (agent-progress-theater): badge flips
          // to a solid check with a bounce while the progress rail advances.
          [["#settle-d1", "#settle-c1", 1.4], ["#settle-d2", "#settle-c2", 2.0], ["#settle-d3", "#settle-c3", 2.6]].forEach(([badge, card, time], i) => {
            // Cross-fade: the number leaves as the check arrives, so the two glyphs never share the badge.
            tl.fromTo("#settle-n" + (i + 1), { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, time);
            tl.fromTo(badge, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)", immediateRender: false }, time);
            tl.fromTo(card, { borderColor: "rgba(155,133,255,0.2)" }, { borderColor: "rgba(22,217,160,0.6)", duration: 0.3, immediateRender: false }, time);
            tl.fromTo("#settle-rail-fill", { scaleX: i / 3 }, { scaleX: (i + 1) / 3, duration: 0.45, ease: "power2.out", immediateRender: false }, time);
          });
          // Hide the later badges from frame 0 without an immediate-render collision.
          tl.set(["#settle-d1", "#settle-d2", "#settle-d3"], { opacity: 0, scale: 0.3 }, 0);

          tl.fromTo("#settle-escrow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, 3.3);

          tl.to("#root", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.7);
          window.__timelines["settle"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
