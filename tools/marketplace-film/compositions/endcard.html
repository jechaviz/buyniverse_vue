<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; font-family: Inter, sans-serif; color: #f4f2ff; }
        #endcard-bloom { position: absolute; left: 50%; top: 42%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 999px; background: radial-gradient(circle, rgba(109, 74, 255, 0.55), rgba(109, 74, 255, 0) 62%); }
        #endcard-lockup { position: relative; display: flex; align-items: center; gap: 36px; }
        #endcard-mark { display: block; width: 300px; height: 300px; }
        #endcard-word { font: 700 150px/1 "Space Grotesk", Inter, sans-serif; letter-spacing: -0.055em; }
        #endcard-word b { color: #9b85ff; font-weight: 700; }
        #endcard-tag { position: relative; font-size: 40px; color: #d8d3ff; letter-spacing: -0.01em; }
        #endcard-url { position: relative; font: 700 34px "Space Grotesk", Inter, sans-serif; color: #16d9a0; letter-spacing: 0.02em; }
      </style>

      <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
        <div id="endcard-bloom"></div>
        <div id="endcard-lockup">
          <img id="endcard-mark" src="assets/brand/buyniverse-mark-1024.png" alt="" />
          <div id="endcard-word">buy<b>niverse</b></div>
        </div>
        <div id="endcard-tag">Cada compra, un universo de proveedores.</div>
        <div id="endcard-url">buyniverse.com</div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Bloom behind the mark (ambient-glow-bloom), then the mark springs from
          // zero and the wordmark reveals beside it (logo-assemble-lockup).
          tl.fromTo("#endcard-bloom", { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
          tl.fromTo("#endcard-mark", { scale: 0, rotation: -18 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.2);
          tl.fromTo("#endcard-word", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.7);
          tl.fromTo("#endcard-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
          tl.fromTo("#endcard-url", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.6);
          // A slow settle on the mark keeps the hold alive to the last frame.
          tl.fromTo("#endcard-mark", { y: 0 }, { y: -10, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.5);

          window.__timelines["endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
